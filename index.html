<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:64px}
a{color:var(--link)}
.hidden{display:none!important}

/* 顶部 */
.top{background:linear-gradient(135deg,#1F3B73,#3a5da8);color:#fff;padding:9px 18px 7px;
  position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(31,59,115,.25);text-align:center}
.top h1{margin:2px 0 2px;font-size:18px;font-weight:800;letter-spacing:1px}
.top .sub{font-size:11.5px;opacity:.9}
.top .accent{height:3px;width:40px;background:var(--accent);border-radius:2px;margin:6px auto 0}

.wrap{max-width:900px;margin:0 auto;padding:16px 12px 26px}
.daterow{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 2px 14px;color:var(--sub);font-size:13px}
.daterow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* 简讯卡片 */
.feed{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--brand),var(--brand2))}
.card .idx{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;
  background:var(--brand);color:#fff;border-radius:8px;font-size:13px;font-weight:700;margin-right:8px}
.card h3{margin:0 0 9px;font-size:16.5px;font-weight:800;line-height:1.45;color:var(--ink);display:flex;align-items:flex-start}
.card h3 .t{flex:1}
.card .event{margin:0 0 11px;color:#2b3648;font-size:14.5px;text-align:justify}
.relation{background:linear-gradient(180deg,#eef4fc,#e6eefa);border:1px solid #cddcf3;border-left:3px solid var(--brand);
  border-radius:10px;padding:10px 12px;margin:0 0 11px}
.relation .lab{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.5px;display:flex;align-items:center;gap:5px;margin-bottom:3px}
.relation p{margin:0;font-size:13.8px;color:#28405f;text-align:justify}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:9px;font-size:12.5px;color:var(--sub)}
.card .foot .src a{color:var(--link);text-decoration:none}
.card .foot .src a:active{opacity:.6}

/* 历史动态：工具区 */
.tools{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.search{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px}
.search:focus{outline:none;border-color:var(--brand2)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.filters select{padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 2px 10px;flex-wrap:wrap}
.bar .count{color:var(--sub);font-size:13px}
.bar .btns{display:flex;gap:8px}
.btn{font-size:13px;padding:9px 13px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--brand)}

/* 历史动态：列表卡 */
.hlist{display:flex;flex-direction:column;gap:10px}
.hitem{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;box-shadow:var(--shadow)}
.hitem .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.hitem .name{font-weight:800;font-size:14.5px;color:var(--brand)}
.tag{display:inline-block;background:var(--chip);color:#274472;border-radius:7px;padding:2px 8px;font-size:11.5px}
.tag.time{background:#eef7f0;color:#1a7f4b}
.tag.city{background:#fdf1ec;color:#b5451c}
.hitem .d{color:#39435a;font-size:13.8px;text-align:justify;margin:3px 0 7px}
.hitem .lk{font-size:12.5px}
.empty{padding:36px;text-align:center;color:var(--sub)}

/* 底部 Tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:60px;background:rgba(255,255,255,.96);
  backdrop-filter:saturate(1.4) blur(8px);border-top:1px solid var(--line);
  display:flex;z-index:30;box-shadow:0 -2px 12px rgba(31,59,115,.08)}
.tabbar button{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:11.5px}
.tabbar button .ic{font-size:20px;line-height:1}
.tabbar button.on{color:var(--brand);font-weight:800}
.tabbar button.on .ic{transform:translateY(-1px)}
@media(min-width:720px){ .filters{grid-template-columns:repeat(4,1fr)} }

    if(fn&&r.name!==fn)return false;
    if(fc&&!(r.city||'').includes(fc))return false;
    if(q){const blob=(r.name+r.field+r.type+r.desc+r.city+r.source).toLowerCase();if(!blob.includes(q))return false;}
    return true;
  });
  document.getElementById('count').textContent=`共 ${rows.length} 条 / 总 ${DATA.length} 条`;
  const box=document.getElementById('hlist');
  document.getElementById('hEmpty').classList.toggle('hidden',rows.length>0);
  box.innerHTML=rows.map(r=>`
    <div class="hitem">
      <div class="meta">
        <span class="name">${esc(r.name)}</span>
        ${r.time?`<span class="tag time">${esc(r.time)}</span>`:''}
        ${r.type?`<span class="tag">${esc(r.type)}</span>`:''}
        ${r.city?`<span class="tag city">${esc(r.city)}</span>`:''}
      </div>
      <div class="d">${esc(r.desc)}</div>
      <div class="lk">${r.url?`🔗 <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.source||'查看来源')}</a>`:esc(r.source||'')}</div>
    </div>`).join('');
}
function bindHistory(){
  fillSel('f_field','industry');fillSel('f_type','type');fillSel('f_name','name');splitCity('f_city');
  ['q','f_field','f_type','f_city','f_name'].forEach(id=>document.getElementById(id).addEventListener('input',renderHistory));
  document.getElementById('reset').onclick=()=>{['q','f_field','f_type','f_city','f_name'].forEach(id=>document.getElementById(id).value='');renderHistory();};
  renderHistory();
}

/* ---------- Tab ---------- */
function switchTab(t){
  const isToday=t==='today';
  document.getElementById('viewToday').classList.toggle('hidden',!isToday);
  document.getElementById('viewHistory').classList.toggle('hidden',isToday);
  document.getElementById('tabToday').classList.toggle('on',isToday);
  document.getElementById('tabHistory').classList.toggle('on',!isToday);
  document.getElementById('topTitle').textContent=isToday?'无锡市重点关注企业商业动态':'无锡市重点关注企业商业动态历史库';
  document.getElementById('topSub').textContent=isToday?'编制：市城运中心 · 来源：政府官网 / 企业公告 / 权威媒体等':`全量 ${DATA.length} 条动态 · 可检索/筛选/下载`;
  window.scrollTo(0,0);
}
renderToday();bindHistory();
</script>
